---
- name: Configuración de los servidores
  hosts: servidores
  # become = usar sudo; necesario para instalar paquetes y crear usuarios
  become: true

  tasks:
    - name: Actualizar la caché de APT
      ansible.builtin.apt:
        update_cache: true

    - name: Crear el usuario itla
      ansible.builtin.user:
        name: itla
        shell: /bin/bash
        create_home: true

    # La carpeta se crea dentro del home de itla y le pertenece,
    # así el usuario puede trabajar en ella sin permisos extra
    - name: Crear la carpeta app
      ansible.builtin.file:
        path: /home/itla/app
        state: directory
        owner: itla
        group: itla
        mode: "0755"

    - name: Crear el archivo hola.txt dentro de app
      ansible.builtin.copy:
        dest: /home/itla/app/hola.txt
        content: "Hola desde Ansible\n"
        owner: itla
        group: itla
        mode: "0644"

    # Una sola tarea con lista de paquetes: más corto y más rápido
    # que una tarea por paquete
    - name: Instalar cowsay y htop
      ansible.builtin.apt:
        name:
          - cowsay
          - htop
        state: present